const DIAS = ["Domingo","Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];
const DIAS_CORTO = ["DOM","LUN","MAR","MIE","JUE","VIE","SAB"];

// CONFIG GLOBAL
let CONFIG = {
  nombre: "PADEL TEAM", logo: null,
  colorPrincipal: "#4a9eff", colorSecundario: "#00d4ff",
  estiloOcupado: "cruz", cantCanchas: 1,
  canchas: [{ nombre:"Cancha 1", apertura:"12:00", cierre:"23:15", duracion:75, receso:false, receso_inicio:"13:00", receso_fin:"15:00" }],
  contactos: []
};

let diaActivo = 0, dias = [], canchaActiva = 0;
let unsubscribers = [], estadosDias = [];

function diaKey(d) {
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function timeToMin(t){ const[h,m]=(t||"00:00").split(":").map(Number); return h*60+m; }
function calcularHoras(c){
  const horas=[]; const dur=parseInt(c.duracion)||75;
  let act=timeToMin(c.apertura||"09:00"); const fin=timeToMin(c.cierre||"23:00");
  const rI=c.receso?timeToMin(c.receso_inicio||"13:00"):-1;
  const rF=c.receso?timeToMin(c.receso_fin||"15:00"):-1;
  while(act+dur<=fin){
    if(c.receso&&act>=rI&&act<rF){act=rF;continue;}
    horas.push(String(Math.floor(act/60)%24).padStart(2,"0")+":"+String(act%60).padStart(2,"0"));
    act+=dur;
  }
  return horas;
}
function emptyDia(horas){ return {ocupados:Array(horas.length).fill(false),nombres:Array(horas.length).fill(""),tels:Array(horas.length).fill(""),fijos:Array(horas.length).fill(false)}; }

// COLORES
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function lum(hex){const{r,g,b}=hexToRgb(hex);return 0.299*r+0.587*g+0.114*b;}
function rgba(hex,a){const{r,g,b}=hexToRgb(hex);return "rgba("+r+","+g+","+b+","+a+")";}
function aclarar(hex,f){f=f||0.55;const{r,g,b}=hexToRgb(hex);return "#"+[r,g,b].map(v=>Math.round(v+(255-v)*f).toString(16).padStart(2,"0")).join("");}
function colorUsable(hex){return lum(hex)<40?aclarar(hex,0.60):hex;}

function aplicarColores(){
  const c1=colorUsable(CONFIG.colorPrincipal);
  const c2=colorUsable(CONFIG.colorSecundario);
  const r=document.documentElement;
  r.style.setProperty("--c1",c1);
  r.style.setProperty("--c2",c2);
  r.style.setProperty("--c1a2",rgba(c1,0.2));
  r.style.setProperty("--c1a1",rgba(c1,0.1));
  r.style.setProperty("--c2a2",rgba(c2,0.2));
  r.style.setProperty("--c2a1",rgba(c2,0.1));
  r.style.setProperty("--cfijo",colorUsable(CONFIG.colorSecundario));
  r.style.setProperty("--cfijoa1",rgba(colorUsable(CONFIG.colorSecundario),0.1));
}

// CARGA CONFIG
async function cargarConfig(){
  try{
    const snap=await getDoc(doc(db,"config","turnos"));
    if(snap.exists()){CONFIG={...CONFIG,...snap.data()};}
    else{
      const v=localStorage.getItem("padelteam_config");
      if(v){const d=JSON.parse(v);CONFIG.contactos=[{nombre:d["cfg-n1"]||"",tel:d["cfg-t1"]||""},{nombre:d["cfg-n2"]||"",tel:d["cfg-t2"]||""},{nombre:d["cfg-n3"]||"",tel:d["cfg-t3"]||""}].filter(c=>c.nombre||c.tel);}
    }
  }catch(e){console.error(e);}
  if(!CONFIG.canchas||CONFIG.canchas.length<CONFIG.cantCanchas){
    CONFIG.canchas=CONFIG.canchas||[];
    while(CONFIG.canchas.length<CONFIG.cantCanchas) CONFIG.canchas.push({nombre:"Cancha "+(CONFIG.canchas.length+1),apertura:"09:00",cierre:"23:00",duracion:75,receso:false});
  }
  aplicarColores();
  renderHeader();
}

function renderHeader(){
  const nombre=CONFIG.nombre||"PADEL TEAM";
  document.title=nombre+" - Turnos";
  const wrap=document.getElementById("header-logo-wrap");
  if(CONFIG.logo){
    wrap.innerHTML="<img src='"+CONFIG.logo+"' style='height:60px;max-width:200px;object-fit:contain;'>";
  } else {
    const p=nombre.toUpperCase().split(" ");
    wrap.innerHTML="<div style='font-family:Bebas Neue,sans-serif;font-size:20px;color:"+CONFIG.colorPrincipal+";letter-spacing:10px;line-height:1;'>"+p[0]+"</div>"
      +(p.length>1?"<div style='font-family:Bebas Neue,sans-serif;font-size:64px;color:#fff;letter-spacing:6px;line-height:0.95;'>"+p.slice(1).join(" ")+"</div>":"")
      +"<div style='font-family:Bebas Neue,sans-serif;font-size:18px;color:"+CONFIG.colorPrincipal+";letter-spacing:6px;margin-top:2px;'>TURNOS</div>";
  }
}

function initDias(){
  dias=[];const hoy=new Date();
  for(let i=0;i<7;i++){const d=new Date(hoy);d.setDate(hoy.getDate()+i);dias.push(d);}
}

function renderDays(){
  const wrap=document.getElementById("daySelector");wrap.innerHTML="";
  dias.forEach((d,i)=>{
    const btn=document.createElement("button");
    btn.className="day-btn"+(i===diaActivo?" active":"");
    btn.textContent=DIAS_CORTO[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    btn.onclick=()=>{diaActivo=i;renderDays();escucharDiaTodasCanchas();};
    wrap.appendChild(btn);
  });
}

function colTurnos(ci){return ci===0?"turnos":"turnos_c"+(ci+1);}
function colFijos(ci){return ci===0?"turnosfijos":"turnosfijos_c"+(ci+1);}

async function guardarDia(ci,key,data){
  try{await setDoc(doc(db,colTurnos(ci),key),data);}catch(e){console.error(e);}
}
async function guardarFijo(ci,ds,idx,nombre,tel,activo){
  const col=colFijos(ci);const key=String(ds);
  const horas=calcularHoras(CONFIG.canchas[ci]);
  const sr=await getDoc(doc(db,col,key));
  let data=sr.exists()?sr.data():{nombres:Array(horas.length).fill(""),tels:Array(horas.length).fill(""),activos:Array(horas.length).fill(false)};
  data.nombres[idx]=nombre;data.tels[idx]=tel;data.activos[idx]=activo;
  await setDoc(doc(db,col,key),data);
}
async function aplicarFijosAlDia(ci,diaDate,diaKeyStr){
  const col=colFijos(ci);const horas=calcularHoras(CONFIG.canchas[ci]);
  const fs=await getDoc(doc(db,col,String(diaDate.getDay())));if(!fs.exists())return;
  const fijos=fs.data();
  const ts=await getDoc(doc(db,colTurnos(ci),diaKeyStr));
  const estado=ts.exists()?ts.data():emptyDia(horas);
  const exc=fijos.excepciones||{};let cambio=false;
  (fijos.activos||[]).forEach((activo,i)=>{
    if(activo&&exc[i]&&exc[i].includes(diaKeyStr))return;
    if(activo){
      const ef=estado.fijos&&estado.fijos[i]===true&&!estado.nombres[i];
      if(!estado.ocupados[i]||ef){estado.ocupados[i]=true;estado.nombres[i]=fijos.nombres[i];estado.tels[i]=fijos.tels[i];if(!estado.fijos)estado.fijos=Array(horas.length).fill(false);estado.fijos[i]=true;cambio=true;}
    }
  });
  if(cambio)await guardarDia(ci,diaKeyStr,estado);
}

function escucharDiaTodasCanchas(){
  unsubscribers.forEach(u=>u&&u());unsubscribers=[];
  estadosDias=Array(CONFIG.cantCanchas).fill(null);
  const key=diaKey(dias[diaActivo]);
  renderColumnasLayout();
  CONFIG.canchas.forEach((c,ci)=>{
    const horas=calcularHoras(c);
    aplicarFijosAlDia(ci,dias[diaActivo],key);
    const unsub=onSnapshot(doc(db,colTurnos(ci),key),snap=>{
      const ae=document.activeElement;
      const esc=ae&&(ae.classList.contains("turno-nombre")||ae.classList.contains("turno-tel"));
      estadosDias[ci]=snap.exists()?snap.data():emptyDia(horas);
      if(!estadosDias[ci].fijos)estadosDias[ci].fijos=Array(horas.length).fill(false);
      if(!esc)renderTurnosCancha(ci);
    });
    unsubscribers.push(unsub);
  });
}

function renderColumnasLayout(){
  const main=document.getElementById("main-content");
  const n=CONFIG.cantCanchas;
  main.innerHTML="";main.style.display="flex";main.style.gap="12px";
  main.style.width="100%";main.style.maxWidth=n>1?"100%":"440px";main.style.alignItems="flex-start";
  const tabs=document.getElementById("canchas-tabs");
  if(n>1){
    tabs.style.display="flex";tabs.innerHTML="";
    CONFIG.canchas.forEach((c,i)=>{
      const btn=document.createElement("button");
      btn.className="cancha-tab"+(i===canchaActiva?" active":"");
      btn.textContent=c.nombre||"Cancha "+(i+1);
      btn.onclick=()=>{canchaActiva=i;document.querySelectorAll(".cancha-tab").forEach((b,j)=>b.classList.toggle("active",j===i));document.querySelectorAll(".cancha-col").forEach((col,j)=>{col.style.display=window.innerWidth<700?(j===i?"flex":"none"):"flex";});};
      tabs.appendChild(btn);
    });
  } else { tabs.style.display="none"; }
  CONFIG.canchas.forEach((c,i)=>{
    const col=document.createElement("div");col.className="cancha-col";col.id="cancha-col-"+i;
    if(n>1&&window.innerWidth<700&&i!==canchaActiva)col.style.display="none";
    if(n>1){const t=document.createElement("div");t.className="cancha-titulo";t.textContent=c.nombre||"Cancha "+(i+1);col.appendChild(t);}
    const tw=document.createElement("div");tw.className="turnos-wrap";tw.id="turnos-wrap-"+i;col.appendChild(tw);
    if(!esCliente&&n===1){const b=document.createElement("div");b.className="btn-group";b.innerHTML="<button class='btn btn-img' onclick='window.generarImagen(0)'>📸 GENERAR IMAGEN</button><button class='btn btn-reset' onclick='window.resetDia(0)'>↺ LIMPIAR DIA</button>";col.appendChild(b);}
    main.appendChild(col);
  });
  if(!esCliente&&n>1){document.getElementById("btns-global").style.display="flex";}
}

function iconoOcupado(esFijo){
  const est=CONFIG.estiloOcupado||"cruz";
  const col=esFijo?CONFIG.colorSecundario||"#a855f7":"#e63946";
  if(est==="pelota")return "<span class='x-icon' style='font-size:40px;position:absolute;line-height:1;'>🎾</span>";
  if(est==="bloque")return "<span class='x-icon' style='position:absolute;width:70px;height:48px;background:"+col+";border-radius:4px;opacity:0.25;'></span>";
  return "<span class='x-icon'><svg width='72' height='52' viewBox='0 0 72 52'><line x1='6' y1='6' x2='66' y2='46' stroke='"+col+"' stroke-width='10' stroke-linecap='round'/><line x1='66' y1='6' x2='6' y2='46' stroke='"+col+"' stroke-width='10' stroke-linecap='round'/></svg></span>";
}

function renderTurnosCancha(ci){
  const cancha=CONFIG.canchas[ci];const horas=calcularHoras(cancha);
  const s=estadosDias[ci];if(!s)return;
  const wrap=document.getElementById("turnos-wrap-"+ci);if(!wrap)return;
  wrap.innerHTML="";
  if(esCliente){
    horas.forEach((hora,i)=>{
      const row=document.createElement("div");row.className="turno-row-cliente";
      const ocp=s.ocupados&&s.ocupados[i];const esTorneo=s.nombres&&s.nombres[i]&&s.nombres[i].toLowerCase()==="torneo";
      if(ocp){row.innerHTML="<div class='cliente-hora ocupado-c'>"+hora+"</div><div class='cliente-estado "+(esTorneo?"torneo-badge":"ocupado-badge")+"'>"+( esTorneo?"TORNEO":"OCUPADO")+"</div>";}
      else{row.innerHTML="<div class='cliente-hora libre-c'>"+hora+"</div><div class='cliente-estado libre-badge'>DISPONIBLE</div>";}
      wrap.appendChild(row);
    });return;
  }
  horas.forEach((hora,i)=>{
    const row=document.createElement("div");row.className="turno-row";
    const esFijo=!!(s.fijos&&s.fijos[i]);
    const esTorneo=s.nombres&&s.nombres[i]&&s.nombres[i].toLowerCase()==="torneo";
    const ocp=s.ocupados&&s.ocupados[i];
    const btn=document.createElement("button");
    btn.className="turno-hora-btn"+(ocp?" ocupado":"")+(esTorneo?" torneo":"")+(esFijo?" fijo":"");
    btn.innerHTML="<span class='hora-text'>"+hora+"</span>"+(ocp?iconoOcupado(esFijo):"");
    btn.onclick=async()=>{
      if(esFijo)return;
      const n={...s,ocupados:[...(s.ocupados||[])],nombres:[...(s.nombres||[])],tels:[...(s.tels||[])],fijos:[...(s.fijos||Array(horas.length).fill(false))]};
      n.ocupados[i]=!n.ocupados[i];if(!n.ocupados[i]){n.nombres[i]="";n.tels[i]="";}
      estadosDias[ci]=n;await guardarDia(ci,diaKey(dias[diaActivo]),n);
    };
    const info=document.createElement("div");info.className="turno-info"+(esTorneo?" torneo-info":"")+(esFijo?" fijo-info":"");
    const nombre=document.createElement("input");nombre.className="turno-nombre"+(esTorneo?" torneo-nombre":"")+(esFijo?" fijo-nombre":"");
    nombre.type="text";nombre.placeholder="Nombre del cliente...";nombre.value=s.nombres&&s.nombres[i]?s.nombres[i]:"";if(esFijo)nombre.readOnly=true;
    let nt=null;
    nombre.oninput=()=>{
      if(esFijo)return;estadosDias[ci].nombres[i]=nombre.value;clearTimeout(nt);
      nt=setTimeout(async()=>{
        const n={...estadosDias[ci],nombres:[...estadosDias[ci].nombres],ocupados:[...estadosDias[ci].ocupados],tels:[...estadosDias[ci].tels],fijos:[...(estadosDias[ci].fijos||Array(horas.length).fill(false))]};
        n.nombres[i]=nombre.value;
        if(nombre.value.toLowerCase()==="torneo"){for(let j=i;j<horas.length;j++){if(!n.ocupados[j]){n.ocupados[j]=true;n.nombres[j]="torneo";}}}
        await guardarDia(ci,diaKey(dias[diaActivo]),n);
      },800);
    };
    const tel=document.createElement("input");tel.className="turno-tel"+(esFijo?" fijo-tel":"");
    tel.type="tel";tel.placeholder="Telefono...";tel.value=s.tels&&s.tels[i]?s.tels[i]:"";if(esFijo)tel.readOnly=true;
    let tt=null;
    tel.oninput=()=>{
      if(esFijo)return;estadosDias[ci].tels[i]=tel.value;clearTimeout(tt);
      tt=setTimeout(async()=>{
        const n={...estadosDias[ci],tels:[...estadosDias[ci].tels],ocupados:[...estadosDias[ci].ocupados],nombres:[...estadosDias[ci].nombres],fijos:[...(estadosDias[ci].fijos||Array(horas.length).fill(false))]};
        n.tels[i]=tel.value;await guardarDia(ci,diaKey(dias[diaActivo]),n);
      },800);
    };
    const cand=document.createElement("button");cand.className="candado-btn"+(esFijo?" bloqueado":"");
    cand.textContent=esFijo?"🔒":"🔓";
    cand.onclick=async(e)=>{
      e.stopPropagation();if(esFijo)return;
      const nv=nombre.value.trim()||s.nombres&&s.nombres[i]||"";const tv=tel.value.trim()||s.tels&&s.tels[i]||"";
      await guardarFijo(ci,dias[diaActivo].getDay(),i,nv,tv,true);
      const n={...estadosDias[ci],ocupados:[...(estadosDias[ci].ocupados||[])],nombres:[...(estadosDias[ci].nombres||[])],tels:[...(estadosDias[ci].tels||[])],fijos:[...(estadosDias[ci].fijos||Array(horas.length).fill(false))]};
      n.ocupados[i]=true;n.nombres[i]=nv;n.tels[i]=tv;n.fijos[i]=true;
      await guardarDia(ci,diaKey(dias[diaActivo]),n);showToast("🔒 Turno fijo guardado");
    };
    cand.ondblclick=async(e)=>{
      e.stopPropagation();if(!esFijo)return;
      const menu=document.createElement("div");
      menu.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:1px solid "+CONFIG.colorPrincipal+";border-radius:12px;padding:20px;z-index:9999;min-width:280px;box-shadow:0 8px 32px rgba(0,0,0,0.5);";
      menu.innerHTML="<div style='font-family:Oswald,sans-serif;font-size:14px;letter-spacing:2px;color:"+CONFIG.colorPrincipal+";margin-bottom:12px;'>DESBLOQUEAR TURNO FIJO</div>"
        +"<div style='font-size:13px;color:#aaa;margin-bottom:16px;'>"+(s.nombres&&s.nombres[i]?s.nombres[i]:"")+" · "+hora+"</div>"
        +"<button id='bm1' style='width:100%;padding:12px;background:rgba(74,158,255,0.1);border:1px solid "+CONFIG.colorPrincipal+";border-radius:8px;color:"+CONFIG.colorPrincipal+";font-family:Oswald,sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;margin-bottom:8px;'>📅 SOLO ESTA SEMANA</button>"
        +"<button id='bm2' style='width:100%;padding:12px;background:rgba(230,57,70,0.1);border:1px solid #e63946;border-radius:8px;color:#e63946;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;margin-bottom:8px;'>🔓 DESBLOQUEAR PERMANENTE</button>"
        +"<button id='bm3' style='width:100%;padding:10px;background:none;border:1px solid #333;border-radius:8px;color:#666;font-family:Oswald,sans-serif;font-size:12px;cursor:pointer;'>CANCELAR</button>";
      document.body.appendChild(menu);
      document.getElementById("bm3").onclick=()=>menu.remove();
      document.getElementById("bm1").onclick=async()=>{
        menu.remove();const fecha=diaKey(dias[diaActivo]);const ds=dias[diaActivo].getDay();const col=colFijos(ci);
        const fs2=await getDoc(doc(db,col,String(ds)));const fd=fs2.exists()?fs2.data():{};
        const exc=fd.excepciones||{};if(!exc[i])exc[i]=[];if(!exc[i].includes(fecha))exc[i].push(fecha);
        await setDoc(doc(db,col,String(ds)),{...fd,excepciones:exc},{merge:true});
        const n={...estadosDias[ci],ocupados:[...(estadosDias[ci].ocupados||[])],nombres:[...(estadosDias[ci].nombres||[])],tels:[...(estadosDias[ci].tels||[])],fijos:[...(estadosDias[ci].fijos||Array(horas.length).fill(false))]};
        n.fijos[i]=false;n.ocupados[i]=false;n.nombres[i]="";n.tels[i]="";
        await guardarDia(ci,diaKey(dias[diaActivo]),n);showToast("📅 Liberado solo esta semana");
      };
      document.getElementById("bm2").onclick=async()=>{
        menu.remove();if(!confirm("Desbloquear permanentemente?"))return;
        await guardarFijo(ci,dias[diaActivo].getDay(),i,"","",false);
        const n={...estadosDias[ci],ocupados:[...(estadosDias[ci].ocupados||[])],nombres:[...(estadosDias[ci].nombres||[])],tels:[...(estadosDias[ci].tels||[])],fijos:[...(estadosDias[ci].fijos||Array(horas.length).fill(false))]};
        n.fijos[i]=false;n.ocupados[i]=false;n.nombres[i]="";n.tels[i]="";
        await guardarDia(ci,diaKey(dias[diaActivo]),n);showToast("🔓 Turno fijo liberado");
      };
    };
    const fields=document.createElement("div");fields.className="turno-info-fields";fields.appendChild(nombre);fields.appendChild(tel);
    info.appendChild(fields);info.appendChild(cand);row.appendChild(btn);row.appendChild(info);wrap.appendChild(row);
  });
}

window.resetDia=async function(ci){
  if(!confirm("Limpiar todos los turnos de este dia?"))return;
  const horas=calcularHoras(CONFIG.canchas[ci]);
  await guardarDia(ci,diaKey(dias[diaActivo]),emptyDia(horas));showToast("✓ Turnos limpiados");
};

window.generarImagen=async function(ci){
  if(!estadosDias[ci])return;
  const s=estadosDias[ci];const cancha=CONFIG.canchas[ci];const horas=calcularHoras(cancha);
  const dia=dias[diaActivo];
  const diaLabel=DIAS[dia.getDay()].toUpperCase()+" "+String(dia.getDate()).padStart(2,"0")+"/"+String(dia.getMonth()+1).padStart(2,"0");
  document.getElementById("ct-dia").textContent=diaLabel;
  if(CONFIG.cantCanchas>1){const cl=document.getElementById("ct-cancha-label");cl.style.display="block";cl.textContent=cancha.nombre||"Cancha "+(ci+1);}
  const clw=document.getElementById("ct-logo-wrap");
  if(CONFIG.logo){clw.innerHTML="<img src='"+CONFIG.logo+"' style='height:70px;max-width:180px;object-fit:contain;'>";}
  else{const p=(CONFIG.nombre||"PADEL TEAM").toUpperCase().split(" ");clw.innerHTML="<div style='font-family:Bebas Neue,sans-serif;font-size:28px;color:"+CONFIG.colorPrincipal+";letter-spacing:8px;'>"+p[0]+"</div>"+(p.length>1?"<div style='font-family:Bebas Neue,sans-serif;font-size:72px;color:#fff;letter-spacing:8px;line-height:0.9;'>"+p.slice(1).join(" ")+"</div>":"")+"<div style='font-family:Bebas Neue,sans-serif;font-size:20px;color:"+CONFIG.colorPrincipal+";letter-spacing:6px;margin-top:2px;'>TURNOS DISPONIBLES</div>";}
  const ctT=document.getElementById("ct-turnos");ctT.innerHTML="";
  horas.forEach((hora,i)=>{
    const div=document.createElement("div");div.className="ct-turno";
    const ocp=s.ocupados&&s.ocupados[i];const esTorneo=s.nombres&&s.nombres[i]&&s.nombres[i].toLowerCase()==="torneo";
    if(ocp&&esTorneo){div.innerHTML="<div class='ct-hora-wrap'><span class='ct-hora' style='color:"+CONFIG.colorSecundario+";font-size:32px;letter-spacing:4px;'>TORNEO</span></div>";}
    else if(ocp){div.innerHTML="<div class='ct-hora-wrap'><span class='ct-hora' style='color:#2a2a2a;'>"+hora+"</span><span class='ct-x'><svg width='82' height='58' viewBox='0 0 82 58'><line x1='7' y1='7' x2='75' y2='51' stroke='#e63946' stroke-width='11' stroke-linecap='round'/><line x1='75' y1='7' x2='7' y2='51' stroke='#e63946' stroke-width='11' stroke-linecap='round'/></svg></span></div><span class='ct-cliente'>OCUPADO</span>";}
    else{div.innerHTML="<div class='ct-hora-wrap'><span class='ct-hora' style='color:"+CONFIG.colorPrincipal+";'>"+hora+"</span></div>";}
    ctT.appendChild(div);
  });
  const ctC=document.getElementById("ct-contactos");ctC.innerHTML="";
  (CONFIG.contactos||[]).forEach(c=>{if(c.nombre||c.tel){const p=document.createElement("div");p.className="ct-contacto";p.textContent=(c.tel||"")+(c.nombre?"  ( "+c.nombre+" )":"");ctC.appendChild(p);}});
  showToast("⏳ Generando imagen...");await new Promise(r=>setTimeout(r,350));
  try{
    const canvas=await html2canvas(document.getElementById("canvas-template"),{backgroundColor:"#000000",scale:2,useCORS:true,logging:false});
    const dataUrl=canvas.toDataURL("image/png");
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)){const w=window.open();w.document.write("<html><body style='background:#000;margin:0;padding:10px;text-align:center'><img src='"+dataUrl+"' style='width:100%;max-width:600px;display:block;margin:0 auto'><p style='font-family:sans-serif;color:#666;padding:12px;font-size:14px'>Mantene presionada para guardar 📥</p></body></html>");showToast("✓ Mantene presionada para guardar");}
    else{const l=document.createElement("a");l.download="turnos_"+diaLabel.replace("/","_").replace(" ","_")+".png";l.href=dataUrl;l.click();showToast("✓ Imagen descargada");}
  }catch(e){showToast("Error al generar imagen");console.error(e);}
};

function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800);}

async function init(){
  await cargarConfig();initDias();renderDays();
  if(esCliente){document.getElementById("modoCliente").style.display="block";document.getElementById("modoEquipo").style.display="none";document.getElementById("btns-global").style.display="none";}
  else{document.getElementById("modoCliente").style.display="none";document.getElementById("modoEquipo").style.display="block";}
  escucharDiaTodasCanchas();
}
init();
</script>
